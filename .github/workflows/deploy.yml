---
name: Deploy
run-name: "Deploy (${{ github.ref_name }})"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for AWS OIDC — no long-lived access keys
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::213533013207:role/fireball-enterprise-landing-deploy
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync dist/ s3://fireballenterprise.com --delete

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id E13CBSJFG44K6X --paths "/*"
