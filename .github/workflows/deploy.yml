---
name: Deploy
run-name: "Deploy (${{ github.ref_name }})"

# Single-branch site — every push to main is a release. The version job bumps the VERSION patch
# (X.Y.Z -> X.Y.(Z+1)), syncs package.json, tags X.Y.Z (no v prefix), and publishes a GitHub
# Release; then the deploy job builds and ships. VERSION is plain X.Y.Z, read via
# [tool.setuptools.dynamic] elsewhere in the family (this repo is npm-only). Family-wide scheme:
# see fireball_orchestrator's versioning.instructions.md.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - VERSION

jobs:
  # 🔢 Bump the VERSION patch, tag, and publish a GitHub Release
  version:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    concurrency: version-bump-main
    permissions:
      contents: write
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7

      - name: Bump VERSION patch, tag, release
        run: |
          IFS=. read -r major minor patch <<<"$(cut -d- -f1 < VERSION)"
          new_version="$major.$minor.$((patch + 1))"
          echo "$new_version" > VERSION
          node -e "const p=require('./package.json');p.version='$new_version';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --package-lock-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json package-lock.json
          git commit -m "chore: bump VERSION to $new_version [skip ci]"
          git tag "$new_version"
          git push origin HEAD:main "$new_version"
          gh release create "$new_version" --target main --title "$new_version" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: version
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for AWS OIDC — no long-lived access keys
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
        with:
          ref: main
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::213533013207:role/fireball-enterprise-landing-deploy
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync dist/ s3://fireballenterprise.com --delete

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id E13CBSJFG44K6X --paths "/*"
